    <script>
      // Ensure window.fetch has both a getter and setter so browser extensions and evaluators can safely wrap it
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          var descriptor = {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            }
          } catch (e2) {}
        } catch (err) {}
      })();
    </script>
